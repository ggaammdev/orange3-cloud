name: CI

on:
  push:
  pull_request:
  workflow_call:  # the release workflow runs the same checks first

permissions:
  contents: read

concurrency:
  # When the release workflow calls this one, github.workflow is "Release", so
  # its checks don't cancel (or get cancelled by) CI on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # The oldest Python the add-on supports, so code that needs a newer
          # one fails here. pip then installs the newest Orange that runs on it.
          python-version: "3.10"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # Shared libraries that Qt needs even on the offscreen platform.
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install Orange, PyQt6 and the add-on
        run: uv pip install orange3 PyQt6 -e ".[dev,server]"

      - name: Versions
        run: python -c "import platform; from importlib.metadata import version as v; print('Python', platform.python_version(), '/ Orange', v('orange3'))"

      - name: Ruff
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

      - name: Import rules
        run: lint-imports

      - name: Pytest
        run: pytest -q
